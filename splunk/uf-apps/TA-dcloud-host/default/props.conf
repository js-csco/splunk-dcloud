#
# props.conf - structured (JSON) parsing for the host-metrics scripted input.
#
# INDEXED_EXTRACTIONS runs on the Universal Forwarder for its own inputs, so the
# JSON keys arrive at the indexer as indexed fields. The indexer's `metrics` app
# then applies METRIC-SCHEMA-TRANSFORMS to turn them into metric data points.
#
[linux:metrics]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = metric_ts
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
category = Metrics
