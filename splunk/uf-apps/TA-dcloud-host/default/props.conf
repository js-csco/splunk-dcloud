#
# props.conf - intentionally minimal.
#
# The UF forwards host-metrics events RAW (key=value); it must NOT do structured
# parsing. All parsing + log-to-metrics happens on the indexer (see the `metrics`
# app props/transforms). Doing INDEXED_EXTRACTIONS here would pre-cook the events
# and bypass the indexer's metric-schema transform, so the metric index would
# drop them. Sourcetype is assigned by inputs.conf.
#
[linux:metrics]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
