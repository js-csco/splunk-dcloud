#
# inputs.conf - DEFAULTS ONLY (disabled). install-uf.sh writes local/inputs.conf
# with the per-site index and the <site> argument. These stanzas are inert until
# then so the TA never sends data to the wrong (or default) index.
#
[script://./bin/collect_host_metrics.sh]
index = default
sourcetype = linux:metrics
interval = 60
disabled = 1

[monitor:///var/log]
index = default
sourcetype = linux:syslog
disabled = 1
