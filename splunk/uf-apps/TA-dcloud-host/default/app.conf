#
# app.conf - TA-dcloud-host (Universal Forwarder add-on)
#
# Collects host metrics (CPU/mem/disk/load) and tails /var/log on an Ubuntu box
# and forwards to the indexer. install-uf.sh writes local/inputs.conf with the
# correct per-site index (london_* / berlin_*).
#
[install]
is_configured = true
state = enabled

[ui]
is_visible = false

[launcher]
author = js-csco
description = Host metrics + /var/log file monitor for a Universal Forwarder.
version = 0.1.0

[package]
id = TA-dcloud-host
