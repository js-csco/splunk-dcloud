#
# inputs.conf - Proxmox REST poller for a Universal Forwarder (Berlin, local).
#
# Runs the poller via a shell wrapper that uses the host's system python3
# (the UF does not bundle Python). Output is forwarded to the indexer and
# lands in berlin_proxmox (sourcetype parsed on the indexer).
#
[script://./bin/poll_proxmox.sh]
index = berlin_proxmox
sourcetype = proxmox:api
interval = 60
disabled = 0
