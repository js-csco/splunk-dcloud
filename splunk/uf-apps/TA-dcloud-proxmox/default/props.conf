#
# props.conf - structured (JSON) parsing for the Proxmox METRICS scripted input.
#
# INDEXED_EXTRACTIONS runs on the UF so the JSON keys arrive as indexed fields;
# the indexer's `metrics` app then applies the proxmox log-to-metrics schema.
# (proxmox:api events are parsed on the indexer via get_data_in/props.conf and
# need no config here.)
#
[proxmox:metrics]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = metric_ts
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
category = Metrics
