#
# props.conf - intentionally minimal.
#
# The UF forwards proxmox:metrics events RAW (key=value); all parsing + log-to-
# metrics happens on the indexer (see the `metrics` app). INDEXED_EXTRACTIONS
# here would pre-cook the events and bypass the indexer's metric-schema
# transform, so the metric index would drop them. (proxmox:api events are parsed
# on the indexer via get_data_in/props.conf.) Sourcetype is set by inputs.conf.
#
[proxmox:metrics]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
