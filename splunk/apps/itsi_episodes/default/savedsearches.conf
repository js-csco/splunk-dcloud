#
# savedsearches.conf - ITSI Correlation Search (config-as-code).
#
# This is a real ITSI correlation search: action.itsi_event_generator turns each
# result row into a NOTABLE EVENT that shows up in ITSI -> Episode Review and is
# grouped into an Episode by a Notable Event Aggregation Policy.
#
# It reads ITSI's OWN service-health output from the itsi_summary index (ITSI
# writes one ServiceHealthScore row per service per minute once services have
# KPIs), so it fires for ANY service that goes High/Critical - which, with the
# importance-weighted Reachability KPIs, is exactly what happens when you kill a
# container: Web/DB Service -> Directory App -> Berlin all cross the threshold.
#
# alert_level is ITSI's numeric severity: 6=Critical, 5=High, 4=Medium, 3=Low,
# 2=Normal, 1=Info. We raise a notable at High or worse (>=5). One notable per
# service per run; the aggregation policy de-dupes them into a single Episode.
#
[dcloud - Service degraded (ITSI notable)]
description = Correlation search: raise an ITSI notable event when a service's health score is High or Critical.
search = index=itsi_summary kpi="ServiceHealthScore" alert_level>=5 \
| dedup serviceid sortby -_time \
| eval itsi_service_ids=serviceid \
| eval severity=alert_level \
| eval svc=coalesce(service_name,serviceid) \
| eval title="Service degraded: ".svc \
| eval description="ITSI service health for ".svc." is ".alert_severity." (score ".round(alert_value)."/100). Open Root Cause Analysis to find the failing tier." \
| table _time serviceid itsi_service_ids svc alert_severity alert_value severity title description
cron_schedule = */1 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 0
request.ui_dispatch_app = itsi
request.ui_dispatch_view = itsi_correlation_searches
# --- ITSI notable-event generation (the "correlation" part) -----------------
action.itsi_event_generator = 1
action.itsi_event_generator.param.title = %title%
action.itsi_event_generator.param.description = %description%
action.itsi_event_generator.param.severity = %severity%
action.itsi_event_generator.param.status = 1
action.itsi_event_generator.param.owner = unassigned
action.itsi_event_generator.param.service_ids = %itsi_service_ids%
action.itsi_event_generator.param.search_type = custom
action.itsi_event_generator.param.editor = dcloud
action.itsi_event_generator.param.drilldown_search_title = Root Cause Analysis
action.itsi_event_generator.param.is_ignore_previous_events = 0
