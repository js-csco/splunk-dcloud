#
# app.conf - itsi_episodes: native ITSI Event Analytics as config-as-code.
#
# Ships a Correlation Search that raises an ITSI *notable event* whenever a
# service's health score goes High/Critical. Those notables appear in ITSI ->
# Episode Review and are grouped into Episodes by an aggregation policy (ITSI's
# default policy works out of the box; a custom split-by-service policy + Webex
# action is added by itsi/seed_itsi_episodes.py or a few clicks in the UI).
#
[install]
is_configured = true
state = enabled

[ui]
is_visible = false
label = ITSI Episodes (dCloud)

[launcher]
author = js-csco
description = Config-as-code ITSI correlation search that turns service degradation into notable events / Episodes.
version = 0.1.0

[package]
id = itsi_episodes
