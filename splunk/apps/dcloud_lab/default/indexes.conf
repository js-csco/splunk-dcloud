#
# indexes.conf - lab indexes, scoped PER LOCATION for RBAC.
#
# RBAC rule: an index belongs to exactly ONE location. Roles grant access
# with a location wildcard (london_*, berlin_*), so a user can never see
# another location's data. See apply.sh (ensure_role) for the matching roles.
#
# Naming: <location>_<datatype>.
#   London = Location 2 (198.18.2.0/24)
#   Berlin = Location 3 (198.18.3.0/24)
#   loc1   = the Splunk server itself (infrastructure; global-only)
#

# ===========================================================================
# loc1 - 198.18.1.0/24  (Splunk server; infrastructure)
# ===========================================================================
[loc1_linux]
homePath   = $SPLUNK_DB/loc1_linux/db
coldPath   = $SPLUNK_DB/loc1_linux/colddb
thawedPath = $SPLUNK_DB/loc1_linux/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 604800

# ===========================================================================
# London - Location 2 - 198.18.2.0/24  (ubuntu-loc2, windows-server-2022-loc2, cisco-iq-link)
# ===========================================================================
