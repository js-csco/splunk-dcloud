#
# indexes.conf - lab indexes (fully declarative; created on Splunk restart).
#
# Each index gets its own homePath/coldPath/thawedPath under $SPLUNK_DB.
# These are sized modestly for a short-lived demo lab. Add or rename freely -
# on the next boot the deployment reconciles to whatever is defined here.
#

# --- Linux / OS logs from the Ubuntu senders (syslog, auth, journald) ------
[linux_logs]
homePath   = $SPLUNK_DB/linux_logs/db
coldPath   = $SPLUNK_DB/linux_logs/colddb
thawedPath = $SPLUNK_DB/linux_logs/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 604800

# --- Proxmox VE (host + guest metrics, task logs) --------------------------
[proxmox]
homePath   = $SPLUNK_DB/proxmox/db
coldPath   = $SPLUNK_DB/proxmox/colddb
thawedPath = $SPLUNK_DB/proxmox/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 604800

# --- Network / firewall / flow data ----------------------------------------
[network]
homePath   = $SPLUNK_DB/network/db
coldPath   = $SPLUNK_DB/network/colddb
thawedPath = $SPLUNK_DB/network/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 604800

# --- General-purpose demo / scratch index ----------------------------------
[demo]
homePath   = $SPLUNK_DB/demo/db
coldPath   = $SPLUNK_DB/demo/colddb
thawedPath = $SPLUNK_DB/demo/thaweddb
maxTotalDataSizeMB = 2048
frozenTimePeriodInSecs = 259200
