#
# indexes.conf - lab indexes, scoped PER LOCATION for RBAC.
#
# RBAC rule: an index belongs to exactly ONE location. Roles grant access
# with a location wildcard (loc1_*, loc2_*, loc3_*), so a user can never see
# another location's data. See authorize.conf for the matching roles.
#
# Naming: loc<N>_<datatype>. Splitting by data type within a location is
# optional for RBAC (the loc<N>_* wildcard covers them all) but keeps parsing
# and retention clean.
#

# ===========================================================================
# Location 1 - 198.18.1.0/24  (splunk host)
# ===========================================================================
[loc1_linux]
homePath   = $SPLUNK_DB/loc1_linux/db
coldPath   = $SPLUNK_DB/loc1_linux/colddb
thawedPath = $SPLUNK_DB/loc1_linux/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 604800

