#
# collections.conf - queue for "Save to GitHub" requests.
#
# The dashboard (in the search sandbox, which has NO outbound network) can only
# write locally, so it enqueues a request here via outputlookup. The git-push
# watcher (a scripted input running in splunkd context, which DOES have network)
# picks up pending requests and pushes the branch.
#
[git_save_requests]
enforceTypes = false
