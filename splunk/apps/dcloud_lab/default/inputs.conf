#
# inputs.conf - git-push watcher for the "Save to GitHub" flow.
#
# Runs every 30s in splunkd context (outbound network works here, unlike the
# search sandbox). It reads pending requests from the git_save_requests KV Store
# (via the session key passAuth provides) and runs labsync.sh to push the branch.
# Its own JSON output is indexed as an audit trail (sourcetype=labsync).
#
[script://./bin/git_push_watcher.py]
index = loc1_linux
sourcetype = labsync
interval = 30
passAuth = splunk-system-user
python.version = python3
disabled = 0

# --- HTTP Event Collector (HEC) for Splunk Connect for SNMP (SC4SNMP) --------
# SC4SNMP (on ubuntu-berlin-snmp) delivers polled metrics + traps over HEC.
# Fixed lab token so it's preconfigured every session (throwaway lab creds).
[http]
disabled = 0
port = 8088
enableSSL = 1

[http://sc4snmp]
disabled = 0
token = d1c0feed-5abc-4a1b-9c2d-000000000001
index = berlin_snmp
indexes = berlin_snmp,london_snmp,berlin_metrics,loc1_metrics
