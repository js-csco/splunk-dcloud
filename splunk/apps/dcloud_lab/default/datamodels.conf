#
# datamodels.conf - the DCloudLab data model (for Pivot).
#
# Acceleration is off: the lab's volumes are small so Pivot runs fine unaccelerated,
# and acceleration would add summary disk + a rebuild each session. Turn it on
# (acceleration = 1 + a backfill range) later if Pivot feels slow.
#
[DCloudLab]
acceleration = 0
