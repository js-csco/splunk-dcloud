#
# authorize.conf - lab roles for location-based RBAC.
#
# Each role grants search access to one location's indexes via a wildcard.
# Because indexes are named loc<N>_<datatype>, "loc1_*" covers every current
# and future Location 1 index automatically.
#
# All roles inherit the built-in "user" role for base search capabilities.
#

# --- Location 1 only -------------------------------------------------------
[role_loc1]
importRoles = user
srchIndexesAllowed = loc1_*
srchIndexesDefault = loc1_*
srchJobsQuota = 5
rtSrchJobsQuota = 5

# --- Location 2 only -------------------------------------------------------
[role_loc2]
importRoles = user
srchIndexesAllowed = loc2_*
srchIndexesDefault = loc2_*
srchJobsQuota = 5
rtSrchJobsQuota = 5

# --- Global: all locations (plus internal indexes for the health dashboard) -
[role_global]
importRoles = user
srchIndexesAllowed = loc1_*;loc2_*;loc3_*;_*
srchIndexesDefault = loc1_*;loc2_*;loc3_*
srchJobsQuota = 10
rtSrchJobsQuota = 10
