<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Roboto,Arial,sans-serif">
  <defs>
    <style>
      .bg{fill:#0b1016}
      .loc{fill:#0f1720;stroke:#c8a24a;stroke-width:1.5;rx:8}
      .node{fill:#131c26;stroke:#2b3a4a;stroke-width:1.2;rx:6}
      .link{stroke:#2fa4d8;stroke-width:2;fill:none;opacity:.85}
      .t{fill:#e6edf3;font-size:13px;font-weight:600}
      .s{fill:#8b98a5;font-size:11px}
      .lbl{fill:#c8a24a;font-size:12px;font-weight:700}
      .net{fill:#cdd9e5;font-size:11px;font-weight:600}
      .cap{fill:#8b98a5;font-size:10px}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="600"/>

  <!-- ================= left: client / internet / gateway ================= -->
  <rect class="node" x="30" y="40" width="120" height="60" rx="6"/>
  <text class="t" x="90" y="66" text-anchor="middle">Cisco Secure</text>
  <text class="t" x="90" y="84" text-anchor="middle">Client</text>

  <circle cx="90" cy="330" r="34" fill="#131c26" stroke="#2b3a4a" stroke-width="1.2"/>
  <text class="s" x="90" y="334" text-anchor="middle">Internet</text>

  <rect class="node" x="180" y="305" width="90" height="50" rx="6"/>
  <text class="t" x="225" y="335" text-anchor="middle">vPodGW</text>

  <path class="link" d="M90,100 L90,296"/>
  <path class="link" d="M124,330 L180,330"/>

  <!-- ================= location tags ================= -->
  <g>
    <rect class="node" x="470" y="150" width="150" height="46" rx="6"/>
    <text class="lbl" x="482" y="172">Location 1</text>
    <text class="net" x="482" y="188">198.18.1.0 /24</text>

    <rect class="node" x="470" y="315" width="150" height="46" rx="6"/>
    <text class="lbl" x="482" y="337">Location 2 · London</text>
    <text class="net" x="482" y="353">198.18.2.0 /24</text>

    <rect class="node" x="470" y="500" width="150" height="46" rx="6"/>
    <text class="lbl" x="482" y="522">Location 3 · Berlin</text>
    <text class="net" x="482" y="538">198.18.3.0 /24</text>
  </g>

  <!-- gateway -> locations -->
  <path class="link" d="M270,330 C360,330 380,173 470,173"/>
  <path class="link" d="M270,330 C360,330 380,338 470,338"/>
  <path class="link" d="M270,330 C360,330 380,523 470,523"/>

  <!-- ================= Location 1: splunk ================= -->
  <rect class="node" x="820" y="40" width="170" height="60" rx="6"/>
  <text class="t" x="835" y="66">splunk</text>
  <text class="s" x="835" y="84">198.18.1.124 · Web/SSH</text>
  <path class="link" d="M620,173 C720,173 740,70 820,70"/>

  <!-- ================= Location 2: London ================= -->
  <rect class="loc" x="700" y="215" width="320" height="150" rx="8" fill="none"/>
  <text class="lbl" x="712" y="234">London</text>

  <rect class="node" x="720" y="245" width="170" height="46" rx="6"/>
  <text class="t" x="732" y="264">ubuntu-desktop-london</text>
  <text class="s" x="732" y="281">198.18.2.11 · client</text>

  <rect class="node" x="720" y="305" width="170" height="46" rx="6"/>
  <text class="t" x="732" y="324">ubuntu-london</text>
  <text class="s" x="732" y="341">198.18.2.x · UF</text>

  <rect class="node" x="905" y="275" width="105" height="46" rx="6"/>
  <text class="t" x="915" y="294">cat8kv-london</text>
  <text class="s" x="915" y="311">198.18.2.32</text>

  <path class="link" d="M620,338 C660,338 665,268 720,268"/>
  <path class="link" d="M620,338 C660,338 665,328 720,328"/>
  <path class="link" d="M890,290 L905,298"/>

  <!-- ================= Location 3: Berlin ================= -->
  <rect class="loc" x="700" y="400" width="320" height="185" rx="8" fill="none"/>
  <text class="lbl" x="712" y="419">Berlin</text>

  <rect class="node" x="720" y="430" width="170" height="46" rx="6"/>
  <text class="t" x="732" y="449">proxmox-berlin</text>
  <text class="s" x="732" y="466">198.18.3.11 · hypervisor</text>

  <rect class="node" x="720" y="525" width="170" height="46" rx="6"/>
  <text class="t" x="732" y="544">ubuntu-berlin</text>
  <text class="s" x="732" y="561">198.18.3.x · UF</text>

  <rect class="node" x="905" y="500" width="105" height="46" rx="6"/>
  <text class="t" x="915" y="519">cat8kv-berlin</text>
  <text class="s" x="915" y="536">198.18.3.32</text>

  <!-- webapp container inside proxmox -->
  <rect class="node" x="740" y="482" width="150" height="34" rx="5" fill="#101722" stroke="#3a4a5c"/>
  <text class="cap" x="752" y="503">↳ webapp-berlin (LXC) 198.18.3.50:8080</text>

  <path class="link" d="M620,523 C660,523 665,453 720,453"/>
  <path class="link" d="M620,523 C660,523 665,548 720,548"/>
  <path class="link" d="M890,523 L905,523"/>

  <text class="cap" x="30" y="580">dCloud Splunk lab — self-rebuilt from github.com/js-csco/splunk-dcloud</text>
</svg>
