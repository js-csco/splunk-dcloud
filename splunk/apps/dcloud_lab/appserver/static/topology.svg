<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1140" height="660" fill="#0f1115"/>
  <text x="30" y="36" fill="#e6edf3" font-size="22" font-weight="700">dCloud Splunk RBAC Lab — Topology</text>
  <text x="30" y="58" fill="#8b98a5" font-size="13">Each device feeds a per-location index; roles grant access by location.</text>

  <!-- ===== defs ===== -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- ===== left chain: client -> internet -> vPodGW ===== -->
  <!-- Client -->
  <rect x="30" y="300" width="150" height="64" rx="8" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="105" y="330" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Cisco Secure</text>
  <text x="105" y="348" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Client (admin)</text>
  <!-- Internet -->
  <ellipse cx="290" cy="332" rx="70" ry="34" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="290" y="337" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Internet</text>
  <!-- vPodGW -->
  <rect x="430" y="300" width="130" height="64" rx="8" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="495" y="330" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">vPodGW</text>
  <text x="495" y="348" fill="#8b98a5" font-size="11" text-anchor="middle">gateway / router</text>

  <line x1="180" y1="332" x2="218" y2="332" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="332" x2="428" y2="332" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- links vPodGW -> locations -->
  <line x1="560" y1="332" x2="636" y2="100" stroke="#4a5568" stroke-width="2"/>
  <line x1="560" y1="332" x2="636" y2="335" stroke="#4a5568" stroke-width="2"/>
  <line x1="560" y1="332" x2="636" y2="545" stroke="#4a5568" stroke-width="2"/>

  <!-- ===== Location 1 ===== -->
  <rect x="640" y="40" width="470" height="120" rx="10" fill="#141b24" stroke="#2b3a4a"/>
  <text x="660" y="68" fill="#cdd9e5" font-size="15" font-weight="700">Location 1 (infra)</text>
  <text x="770" y="68" fill="#8b98a5" font-size="13">198.18.1.0/24</text>
  <!-- splunk -->
  <rect x="660" y="84" width="220" height="58" rx="6" fill="#1e2a1a" stroke="#65a637"/>
  <text x="674" y="108" fill="#e6edf3" font-size="14" font-weight="600">splunk</text>
  <text x="674" y="128" fill="#9bd06a" font-size="12">index: loc1_linux</text>

  <!-- ===== Location 2 ===== -->
  <rect x="640" y="248" width="470" height="172" rx="10" fill="#141b24" stroke="#2b3a4a"/>
  <text x="660" y="276" fill="#cdd9e5" font-size="15" font-weight="700">London (Location 2)</text>
  <text x="770" y="276" fill="#8b98a5" font-size="13">198.18.2.0/24</text>
  <!-- ubuntu-loc2 -->
  <rect x="660" y="292" width="200" height="54" rx="6" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="674" y="314" fill="#e6edf3" font-size="13" font-weight="600">ubuntu-loc2</text>
  <text x="674" y="333" fill="#5aa9e6" font-size="12">index: london_linux</text>
  <!-- windows-server-2022-loc2 -->
  <rect x="660" y="352" width="200" height="54" rx="6" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="674" y="374" fill="#e6edf3" font-size="13" font-weight="600">windows-server-2022</text>
  <text x="674" y="393" fill="#5aa9e6" font-size="12">index: london_windows</text>
  <!-- cisco-iq-link -->
  <rect x="884" y="292" width="206" height="54" rx="6" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="898" y="314" fill="#e6edf3" font-size="13" font-weight="600">cisco-iq-link</text>
  <text x="898" y="333" fill="#5aa9e6" font-size="12">index: london_network</text>

  <!-- ===== Location 3 ===== -->
  <rect x="640" y="470" width="470" height="150" rx="10" fill="#141b24" stroke="#2b3a4a"/>
  <text x="660" y="498" fill="#cdd9e5" font-size="15" font-weight="700">Berlin (Location 3)</text>
  <text x="770" y="498" fill="#8b98a5" font-size="13">198.18.3.0/24</text>
  <!-- proxmox -->
  <rect x="660" y="514" width="200" height="54" rx="6" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="674" y="536" fill="#e6edf3" font-size="13" font-weight="600">proxmox-9.2-loc3</text>
  <text x="674" y="555" fill="#d6a25a" font-size="12">index: berlin_proxmox</text>
  <!-- ubuntu-loc3 -->
  <rect x="884" y="514" width="206" height="54" rx="6" fill="#1b2430" stroke="#3a4a5a"/>
  <text x="898" y="536" fill="#e6edf3" font-size="13" font-weight="600">ubuntu-loc3</text>
  <text x="898" y="555" fill="#d6a25a" font-size="12">index: berlin_linux</text>

  <!-- ===== RBAC legend ===== -->
  <text x="30" y="470" fill="#cdd9e5" font-size="14" font-weight="700">RBAC</text>
  <rect x="30" y="482" width="360" height="150" rx="8" fill="#141b24" stroke="#2b3a4a"/>
  <text x="46" y="508" fill="#5aa9e6" font-size="13" font-weight="600">role_london</text>
  <text x="170" y="508" fill="#8b98a5" font-size="13">→ london_* only</text>
  <text x="46" y="536" fill="#d6a25a" font-size="13" font-weight="600">role_berlin</text>
  <text x="170" y="536" fill="#8b98a5" font-size="13">→ berlin_* only</text>
  <text x="46" y="564" fill="#e6edf3" font-size="13" font-weight="600">role_global</text>
  <text x="170" y="564" fill="#8b98a5" font-size="13">→ everything (+ loc1 infra)</text>
  <text x="46" y="592" fill="#9bd06a" font-size="13" font-weight="600">loc1</text>
  <text x="170" y="592" fill="#8b98a5" font-size="13">→ infrastructure (global only)</text>
  <text x="46" y="616" fill="#6b7684" font-size="11">Users: leo (London) / ben (Berlin) / gary (global)</text>
</svg>
