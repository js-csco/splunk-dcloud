#
# app.conf - Customer Example: Dashboard Studio dashboards for nine pain points
# from a hospital customer's discovery workshop, shown for a fictional hospital
# ("Spital Aarwald") with realistic sample data. The views are generated by
# scripts/build_customer_example.py - edit there, not the XML.
#

[install]
is_configured = true
state = enabled

[ui]
is_visible = true
label = Customer Example

[launcher]
author = js-csco
description = Nine use-case dashboards from a hospital discovery workshop, with realistic sample data and the data sources each one needs in Splunk.
version = 0.2.0

[package]
id = customer_example
