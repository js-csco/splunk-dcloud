#
# app.conf - Customer Example: dashboards built from a real customer discovery
# conversation (hospital / healthcare operations). Each dashboard illustrates
# one pain point raised in the meeting, with a representative example (built
# from synthetic sample data, since the source systems aren't part of this
# lab) and the data sources that would be onboarded to solve it for real.
#

[install]
is_configured = true
state = enabled

[ui]
is_visible = true
label = Customer Example

[launcher]
author = js-csco
description = Use-case dashboards distilled from a customer discovery workshop - one per pain point, each with a worked example and the data sources needed to build it for real.
version = 0.1.0

[package]
id = customer_example
