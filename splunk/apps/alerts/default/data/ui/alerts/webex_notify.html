<form class="form-horizontal">
  <div class="control-group">
    <label class="control-label" for="webex_message">Message</label>
    <div class="controls">
      <input type="text" name="action.webex_notify.param.message" id="webex_message" class="input-xxlarge"/>
      <span class="help-block">Text sent to the Webex space. Supports tokens like $name$ and $result.field$. The credential is read from var/lib/dcloud/webex.env.</span>
    </div>
  </div>
</form>
