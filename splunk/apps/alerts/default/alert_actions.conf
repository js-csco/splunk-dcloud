#
# alert_actions.conf - email delivery settings for the alerts in this app.
#
# IMPORTANT: the dCloud lab has no mail server by default, and Proton Mail does
# not accept arbitrary SMTP, so out of the box email will NOT leave the lab. The
# alerts still FIRE and appear under Activity > Triggered Alerts and on the
# "Alerts" dashboard regardless.
#
# To actually deliver mail, point mailserver at an SMTP relay Splunk can reach
# (edit here, or Settings > Server settings > Email settings). For a real inbox,
# a relay that accepts authenticated submission is typically required.
#
[email]
mailserver = localhost:25
from = splunk-dcloud@cisco.dcloud
use_ssl = 0
use_tls = 0
# auth_username =
# auth_password =

# --- Webex custom alert action --------------------------------------------
# Sends a message to a Webex space. The credential is read out-of-repo from
# $SPLUNK_HOME/var/lib/dcloud/webex.env (apply.sh prompts for it) - either a
# WEBEX_WEBHOOK_URL (incoming webhook) or WEBEX_BOT_TOKEN + WEBEX_ROOM_ID.
[webex_notify]
is_custom = 1
label = Webex message
description = Post a message to a Webex space (incoming webhook or bot).
payload_format = json
icon_path = appIcon.png
param.message = Splunk alert fired.
