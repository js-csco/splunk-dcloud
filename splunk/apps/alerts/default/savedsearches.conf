#
# savedsearches.conf - scheduled alerts (config-as-code, rebuilt every session).
#
# Both alerts:
#   * run every 5 minutes,
#   * trigger when the search returns >0 results,
#   * are tracked (Activity > Triggered Alerts) so they are ALWAYS visible in
#     Splunk even if outbound email isn't configured,
#   * email js-csco@proton.me (requires a reachable SMTP relay - see
#     alert_actions.conf and the README "Alerts" section).
#

# --- 1) High CPU or Memory (>70%) on any host --------------------------------
[dcloud - High CPU or Memory over 70pct]
description = Fires when a host's latest CPU% or memory% is above 70%.
search = index=loc1_metrics OR index=london_metrics OR index=berlin_metrics sourcetype=linux:metrics \
| stats latest(cpu_pct) as cpu_pct latest(mem_used_pct) as mem_used_pct latest(host) as host by site \
| where cpu_pct>70 OR mem_used_pct>70 \
| eval breach=case(cpu_pct>70 AND mem_used_pct>70,"CPU+MEM", cpu_pct>70,"CPU", 1==1,"MEM") \
| table site host breach cpu_pct mem_used_pct
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 15m
actions = email
action.email = 1
action.email.to = js-csco@proton.me
action.email.subject = [dCloud Splunk] High CPU/MEM (>70%)
action.email.message.alert = One or more hosts exceeded 70% CPU or memory in the last 5 minutes. See the attached results (site, host, which metric, values).
action.email.inline = 1
action.email.sendresults = 1
action.email.format = table

# --- 1b) SNMP trap received -> Webex message ---------------------------------
# Demo of the custom "Webex message" alert action (Trap -> Alert, but Webex not
# email). DISABLED by default: enable it in Settings > Searches, or turn it on
# here (enableSched = 1) once var/lib/dcloud/webex.env has a credential. Fires
# when SC4SNMP writes an SNMP trap into the regional SNMP index (e.g. a device
# reload/linkDown). Regionally scoped like the rest of the lab (berlin_snmp).
[dcloud - SNMP trap received -> Webex]
description = When an SNMP trap arrives in the SNMP index, post a Webex message. Demo of the Webex custom alert action.
search = index=berlin_snmp OR index=london_snmp (sourcetype=sc4snmp:traps OR sourcetype="*trap*" OR "snmptrap") \
| head 20 \
| eval device=coalesce(host,src_ip,"unknown"), summary=coalesce(oid,message,_raw) \
| table _time device summary
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 5m
actions = webex_notify
action.webex_notify = 1
action.webex_notify.param.message = SNMP trap received in the dCloud lab - a monitored device raised a notification (e.g. reload / linkDown). Check the SNMP dashboard.

# --- 1c) Service unavailable -> Webex message --------------------------------
# Fires when the Web or DB container stops answering its port probe (the same
# signal the ITSI Reachability KPI uses), so it catches BOTH a manual shutdown
# and demo-chaos break-*. Runs every minute; ENABLED (the box carries webex.env,
# provisioned by apply.sh - if it's ever missing the action just logs and no-ops).
[dcloud - Service unavailable -> Webex]
description = When the Web or Database container stops answering its port probe, post a Webex message.
search = index=berlin_web sourcetype=port:probe (host=webapp-berlin OR host=db-berlin) earliest=-3m \
| stats latest(open) as open by host \
| where open=0 \
| eval svc=case(host=="webapp-berlin","Web Service",host=="db-berlin","Database Service",1==1,host) \
| stats values(svc) as services \
| eval message="🔴 dCloud Directory App degraded - UNREACHABLE: ".mvjoin(services,", ").". Open ITSI Service Analyzer / Glass Table for impact." \
| table message services
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */1 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 5m
actions = webex_notify
action.webex_notify = 1
action.webex_notify.param.message = $result.message$

# --- 1d) Incident rollup -> single Webex "episode" ---------------------------
# The "episode" idea as config-as-code: instead of one alert per broken KPI,
# this rolls ALL degraded Berlin components into ONE incident and posts ONE
# Webex message summarising them. $result.message$ is substituted by Splunk with
# the summary the search builds. DISABLED by default; enable once webex.env is
# set. For the full native ITSI experience (Episode Review, aggregation policy),
# build a Correlation Search + Notable Event Aggregation Policy in the ITSI UI -
# see the README "ITSI Episodes" section.
[dcloud - Incident: services degraded -> Webex episode]
description = Rolls all degraded Berlin components into one incident and posts a single Webex message.
search = | makeresults \
| appendcols [ search index=berlin_web sourcetype=port:probe port=8080 earliest=-10m | stats latest(open) as web ] \
| appendcols [ search index=berlin_web sourcetype=port:probe port=5432 earliest=-10m | stats latest(open) as db ] \
| appendcols [ search index=berlin_metrics sourcetype=linux:metrics host=ubuntu-berlin earliest=-10m | stats latest(cpu_pct) as ub_cpu latest(disk_used_pct) as ub_disk ] \
| eval issues=mvappend( \
    if(web=0,"Web Service unreachable",null()), \
    if(db=0,"Database Service unreachable",null()), \
    if(ub_cpu>90,"Ubuntu Berlin CPU critical (".round(ub_cpu)."%)",null()), \
    if(ub_disk>90,"Ubuntu Berlin disk critical (".round(ub_disk)."%)",null())) \
| eval n=mvcount(issues) \
| where n>0 \
| eval message="🔴 Incident - ".n." component(s) degraded in Berlin: ".mvjoin(issues,"; ") \
| table message n
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
actions = webex_notify
action.webex_notify = 1
action.webex_notify.param.message = $result.message$

# --- 2) Universal Forwarder stopped sending ----------------------------------
# Any host that WAS sending host metrics but has produced nothing for >10 min.
[dcloud - Universal Forwarder stopped sending]
description = Fires when a host that was sending metrics has no new metric events for over 10 minutes.
search = | tstats latest(_time) as last_seen WHERE index=loc1_metrics OR index=london_metrics OR index=berlin_metrics by host \
| eval mins_since=round((now()-last_seen)/60,1) \
| where mins_since>10 \
| eval last_seen=strftime(last_seen,"%F %T"), message="No metrics from ".host." for ".mins_since." minutes" \
| table host last_seen mins_since message
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 30m
actions = email
action.email = 1
action.email.to = js-csco@proton.me
action.email.subject = [dCloud Splunk] Forwarder stopped sending
action.email.message.alert = A host stopped sending metrics for more than 10 minutes (UF down or host unreachable).
action.email.inline = 1
action.email.sendresults = 1
action.email.format = table
