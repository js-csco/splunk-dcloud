#
# inputs.conf - Get Data In: scripted/modular data inputs.
#

# --- REST API polling: Proxmox (Berlin) ------------------------------------
# Runs poll_proxmox.py every 60s on the Splunk host; output -> berlin_proxmox.
# Self-guards if no Proxmox creds are configured, so it is safe to leave on.
[script://./bin/poll_proxmox.py]
index = berlin_proxmox
sourcetype = proxmox:api
interval = 60
disabled = 0
python.version = python3

# --- SSH into Cisco devices: show version/license/ntp/cert etc. -------------
# One stanza per site; the script looks up the device in bin/routers.csv.
# Runs every 5 minutes. Needs sshpass on the Splunk host (apply.sh installs it).
[script://./bin/ssh_router.sh london]
index = london_network
sourcetype = cisco:ios
interval = 300
disabled = 0

[script://./bin/ssh_router.sh berlin]
index = berlin_network
sourcetype = cisco:ios
interval = 300
disabled = 0
