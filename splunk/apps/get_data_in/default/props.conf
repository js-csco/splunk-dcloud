#
# props.conf - parse the Proxmox API scripted-input output (one JSON per line).
#

[proxmox:api]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = "poll_time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 100000

# Cisco "show" command output from ssh_router.sh - one event per command,
# each starting with a "##DCLOUD## ts=... command=..." header line.
[cisco:ios]
SHOULD_LINEMERGE = false
LINE_BREAKER = (##DCLOUD##\s+)
TIME_PREFIX = ts="
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 100000
