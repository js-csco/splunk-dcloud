#
# inputs.conf - local host-metrics collection on the Splunk server itself.
#
# The Splunk host is the Location 1 device, so it collects its OWN CPU/mem/disk
# metrics locally (no forwarder, no network) -> loc1_metrics. This guarantees
# the Host Metrics dashboard always has at least one machine's data, even if the
# Ubuntu UFs aren't up yet. Ubuntu hosts feed london_metrics/berlin_metrics via
# the Universal Forwarder (TA-dcloud-host).
#
[script://./bin/collect_host_metrics.sh loc1]
index = loc1_metrics
sourcetype = linux:metrics
interval = 60
disabled = 0
