#
# transforms.conf - log-to-metrics schemas.
#
# METRIC-SCHEMA-MEASURES lists the fields that become measures (metric_name =
# the field name, e.g. cpu_pct). Every other extracted field becomes a
# dimension unless blacklisted. metric_ts is only the timestamp, so drop it.

# Linux host: all numeric JSON fields are measures; site/os stay dimensions.
[metric-schema:linux_host]
METRIC-SCHEMA-MEASURES = _ALLNUMS_
METRIC-SCHEMA-BLACKLIST-DIMS = metric_ts

# Proxmox: measures are explicit (vmid must remain a DIMENSION, not a measure).
[metric-schema:proxmox]
METRIC-SCHEMA-MEASURES = cpu_pct,mem_used_pct,mem_used_mb,mem_total_mb,disk_used_pct,disk_gb,running,uptime_s
METRIC-SCHEMA-BLACKLIST-DIMS = metric_ts
