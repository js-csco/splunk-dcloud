#
# props.conf - parse metric events (key=value) and convert them to metric data
# points at INDEX TIME (log-to-metrics), on the INDEXER's parsing pipeline.
#
# Pipeline per event:
#   1. TIME_PREFIX/TIME_FORMAT   -> timestamp from metric_ts=
#   2. TRANSFORMS (dcloud_metric_kv) -> index-time extraction of every key=value
#      pair into indexed fields (WRITE_META)
#   3. METRIC-SCHEMA-TRANSFORMS   -> numeric fields become measures, strings
#      become dimensions; host/source/sourcetype are dimensions automatically
#
# Why key=value + indexer-side extraction (NOT INDEXED_EXTRACTIONS=json on the
# UF): a UF that does structured (json) extraction forwards pre-cooked events
# that BYPASS the indexer parsing pipeline, so METRIC-SCHEMA-TRANSFORMS never
# runs and the metric index drops them. Raw key=value forwarded to the indexer
# goes through parsing here, which works for BOTH forwarded (UF) and local
# (loc1) inputs.

# --- Linux host metrics (ubuntu-london, ubuntu-berlin, loc1/Splunk host) ----
[linux:metrics]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = metric_ts=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Metrics
TRANSFORMS-dcloudkv = dcloud_metric_kv
METRIC-SCHEMA-TRANSFORMS = metric-schema:linux_host

# --- Proxmox resource metrics (per node + per guest) ------------------------
[proxmox:metrics]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = metric_ts=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Metrics
TRANSFORMS-dcloudkv = dcloud_metric_kv
METRIC-SCHEMA-TRANSFORMS = metric-schema:proxmox
