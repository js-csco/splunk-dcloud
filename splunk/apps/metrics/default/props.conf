#
# props.conf - parse metric events (JSON) and convert them to metric data
# points at INDEX TIME (log-to-metrics).
#
# The scripted inputs / forwarders emit one JSON object per line. We use:
#   INDEXED_EXTRACTIONS = json  -> makes every JSON key an indexed field, which
#                                  log-to-metrics needs available at index time
#   METRIC-SCHEMA-TRANSFORMS    -> converts the numeric fields into measures and
#                                  the string fields into dimensions
# host/source/sourcetype are always dimensions on a metric index automatically,
# so "host" (the sending machine) is available without listing it.
#
# NOTE: for data arriving from a Universal Forwarder, INDEXED_EXTRACTIONS runs
# on the UF (see the TA-dcloud-host / TA-dcloud-proxmox props.conf). This copy
# covers the LOCAL scripted input on the Splunk host (loc1_metrics).

# --- Linux host metrics (ubuntu-london, ubuntu-berlin, loc1/Splunk host) ----
[linux:metrics]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = metric_ts
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
category = Metrics
description = Host CPU/memory/disk/load metrics (JSON -> metric)
METRIC-SCHEMA-TRANSFORMS = metric-schema:linux_host

# --- Proxmox resource metrics (per node + per guest) ------------------------
[proxmox:metrics]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = metric_ts
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
category = Metrics
description = Proxmox node/guest CPU/memory/disk metrics (JSON -> metric)
METRIC-SCHEMA-TRANSFORMS = metric-schema:proxmox
