#
# props.conf - parse metric EVENTS (key=value). These land in normal event
# indexes (*_metrics) and are charted with timechart; Splunk's automatic
# search-time key=value extraction turns cpu_pct=..., mem_used_pct=..., etc.
# into fields with no extra config.
#
# (We deliberately use event indexes + timechart instead of metric indexes +
# log-to-metrics: it is reliable across the self-rebuilding lab and, crucially,
# directly searchable — `index=london_metrics` shows the raw events, so data
# arrival is trivial to verify.)

[linux:metrics]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = metric_ts=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Metrics

[proxmox:metrics]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = metric_ts=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Metrics
