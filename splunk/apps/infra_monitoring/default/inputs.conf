#
# inputs.conf - data receivers on the indexer.
#
# RBAC is preserved by using one syslog port per location: each port writes to
# that location's Linux index, so data can never land in the wrong location.
#

# --- Splunk-to-Splunk receiver (for Universal Forwarders; future use) -------
[splunktcp://9997]
disabled = 0

# --- Syslog (TCP) receivers - one port per location -------------------------
# Location 1 (198.18.1.0/24)
[tcp://5513]
index = loc1_linux
sourcetype = syslog
disabled = 0

# Location 2 (198.18.2.0/24) - ubuntu-loc2, etc.
[tcp://5514]
index = loc2_linux
sourcetype = syslog
disabled = 0

# Location 3 (198.18.3.0/24) - ubuntu-loc3, proxmox-9.2-loc3
[tcp://5515]
index = loc3_linux
sourcetype = syslog
disabled = 0
