#
# inputs.conf - data receivers on the indexer.
#
# RBAC is preserved by using one syslog port per location: each port writes to
# that location's Linux index, so data can never land in the wrong location.
#
#   port 5513 -> loc1_linux    (Splunk host itself; infrastructure)
#   port 5514 -> london_linux  (Location 2 - London)
#   port 5515 -> berlin_linux  (Location 3 - Berlin)
#

# --- Splunk-to-Splunk receiver (for Universal Forwarders; future use) -------
[splunktcp://9997]
disabled = 0

# --- local host-metrics collection on the Splunk server itself --------------
# (moved here from the retired 'metrics' app). The Splunk host is the Location 1
# device, so it collects its OWN CPU/mem/disk metrics locally -> loc1_metrics,
# guaranteeing the Host & Infra Metrics dashboard always has at least one host's
# data even before the Ubuntu UFs are up.
[script://./bin/collect_host_metrics.sh loc1]
index = loc1_metrics
sourcetype = linux:metrics
interval = 60
disabled = 0

# --- active service-reachability probes (run FROM the Splunk server) ---------
# The Splunk box is always up and can route to every location (198.18.x.0/24),
# so it TCP-probes each container's SERVICE port every 60s and emits a PRESENT
# open=1/0. Container/app down -> open=0 (not a data gap) -> ITSI Reachability
# goes decisively RED within ~1-2 min; back up -> GREEN. host= tags each line so
# the ITSI KPI base search can filter host=webapp-berlin / host=db-berlin.
[script://./bin/probe_ports.sh 198.18.3.50 8080 webapp-berlin]
index = berlin_web
sourcetype = port:probe
host = webapp-berlin
interval = 60
disabled = 0

[script://./bin/probe_ports.sh 198.18.3.51 5432 db-berlin]
index = berlin_web
sourcetype = port:probe
host = db-berlin
interval = 60
disabled = 0

# Proxmox hypervisor management UI (8006) - gating health for the tier the
# app containers run on. Hypervisor up -> open=1; host down -> open=0.
[script://./bin/probe_ports.sh 198.18.3.11 8006 proxmox-berlin]
index = berlin_web
sourcetype = port:probe
host = proxmox-berlin
interval = 60
disabled = 0

# --- Syslog (TCP) receivers - one port per location -------------------------
# loc1 - Splunk server infrastructure
[tcp://5513]
index = loc1_linux
sourcetype = syslog
disabled = 0

# London (Location 2, 198.18.2.0/24) - ubuntu-loc2, etc.
[tcp://5514]
index = london_linux
sourcetype = syslog
disabled = 0

# Berlin (Location 3, 198.18.3.0/24) - ubuntu-loc3, proxmox-9.2-loc3
[tcp://5515]
index = berlin_linux
sourcetype = syslog
disabled = 0
