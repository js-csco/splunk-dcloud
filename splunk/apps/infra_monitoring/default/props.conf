#
# props.conf - AUTOMATIC asset enrichment.
#
# Attach the asset fields (asset_name, asset_type, manufacturer, timezone,
# description, owner) to every event by matching host against the per-location
# asset lookups. Because each location's collection only contains that location's
# hosts, a given event matches exactly one lookup; the other two no-op.
#
# RBAC: the lookups are read-gated per role (metadata/default.meta). A user who
# can't read a location's lookup simply doesn't get that automatic lookup applied
# (Splunk skips it) - but since events are already index-RBAC'd, users only ever
# see events (and thus enrichment) for locations they're allowed to see anyway.
#
# "describe an asset once -> all its logs and metrics carry the context", e.g.
#   index=* asset_type=router | stats count by manufacturer

[linux:metrics]
# Metric-event parsing (moved here from the retired 'metrics' app): key=value
# events in *_metrics indexes, timestamp from metric_ts=, charted with timechart.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = metric_ts=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Metrics
LOOKUP-dcloud_asset_loc1   = dcloud_assets_loc1_lk   host OUTPUT asset_name asset_type manufacturer timezone description owner
LOOKUP-dcloud_asset_london = dcloud_assets_london_lk host OUTPUT asset_name asset_type manufacturer timezone description owner
LOOKUP-dcloud_asset_berlin = dcloud_assets_berlin_lk host OUTPUT asset_name asset_type manufacturer timezone description owner

