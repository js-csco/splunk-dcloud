#
# transforms.conf - Asset Configuration lookups.
#
# assets_seed         : committed CSV, the config-as-code source of truth used to
#                       seed the KV Store each session (apply.sh).
# dcloud_assets_*_lk  : per-location KV Store lookups. _key = host so writes
#                       (outputlookup) UPSERT by host. Read/write is gated per
#                       role in metadata/default.meta (RBAC).
#

[assets_seed]
filename = assets_seed.csv

[dcloud_assets_loc1_lk]
external_type = kvstore
collection = dcloud_assets_loc1
fields_list = _key, site, host, ip, asset_name, hostname, asset_type, manufacturer, timezone, description, owner

[dcloud_assets_london_lk]
external_type = kvstore
collection = dcloud_assets_london
fields_list = _key, site, host, ip, asset_name, hostname, asset_type, manufacturer, timezone, description, owner

[dcloud_assets_berlin_lk]
external_type = kvstore
collection = dcloud_assets_berlin
fields_list = _key, site, host, ip, asset_name, hostname, asset_type, manufacturer, timezone, description, owner
